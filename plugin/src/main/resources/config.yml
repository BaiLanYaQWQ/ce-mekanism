# Language used by shared machine inventories and console output.
# Player-facing chat uses the player's CraftEngine locale automatically.
# Supported values: zh_cn, en_us.
language: zh_cn

# Runtime tuning for the B5 digital miner.
b5:
  # Candidate blocks inspected per server tick. Values are clamped to 1..4096.
  miner_scan_budget: 128
  # Same server-side default as Mekanism GeneralConfig.digitalMiner.silkMultiplier.
  miner_silk_multiplier: 12
  # CraftEngine blocks default off because their loot/event lifecycle is owned by the block behavior.
  miner_custom_blocks: false
