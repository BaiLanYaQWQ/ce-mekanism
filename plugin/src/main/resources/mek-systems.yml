# 系统参数（文档 02 第五节）：默认值 = 核心 V10Tables = 随库上游 10.8 的分级表。
# 插件启动时读这个文件 → V10Tables.load(DataTag)；没写的项落回核心默认。
# 想用 mcmod 的 v10 初版读数（管道/储罐/涡轮那几条）改这里的数就行。
# gear/ 段是随身储电物品的数值（充电台充的就是它），取自上游 GearConfig。
# multiblock/ 段是多方块那几个数（锅炉热导、蒸馏塔倍率、涡轮每线圈叶片数），
# 默认值 = 上游 MekanismConfig.general 与 GeneratorsConfig 的默认（见 05 第七节）。
# logistics/ 段是插件侧的三个旋钮（见 06 第十节）：红石刷新间隔、热导线缆热容、
# 元件碰撞（full = 与客户端 leaves 满方块一致，默认；6px = 仅服务端小管径）。
# radiation/ 段（07）：半衰期/间隔/距离取自上游 GeneralConfig（0.9995/s → 27719 刻），
# 伤害与开启容器的倍率是插件侧口径，可按需改。
# generator/ 与 steam/ 发电平衡固定为原版 1.21.x；来源及调整见 docs/energy-balance.md。
# generator/ 段（11）：六台单方块发电机的燃烧/采光/风力/燃料表与默认端口；
# defaults.<family>.sides 用上游 RelativeSide：front = blockstate facing，back = 反向，
# left = 顺时针 90°，right = 逆时针 90°；改完 /mek reload，再用 /mek debug defaults 重落已放置的机器。
# 方块模型、碰撞盒是生成期数据（tools/tables/generators.json → 资源包/GeneratedContent）。
# demo/ 段（09 缺陷收口）：/mek demo 摆一条 机器→物品管道→机器 + 双储罐 的跑通示例；
# charge_j = -1 表示按线缆容量灌满，起始料/水量/id 都可换。
# gui/ 段（08 第十四节）：面板/槽位几何在 gui-layout.yml；这里只放运行时旋钮。
# colors.title 是标题文字色（面板是浅灰 #BEBEBE，默认黑色才看得清）；
# colors.energy/progress/fluid 只染字形条，不影响皮肤图。改完 /mek reload 生效。
# title_width/title_detail 只作用于多方块标题；机器窗口标题固定为“机器名[·等级]”。
gui:
  refresh_ticks: 5
  title_width: 158
  title_detail: auto
  colors:
    title: '000000'
    energy: 3BFB98
    progress: 7DFFB2
    fluid: 3F76E4
