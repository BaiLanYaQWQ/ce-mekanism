# 颜料提取器（mekanism:pigment_extractor）—— mek.py generate 生成，勿手改。
# 方块 id ↔ 蓝图 id ↔ 工厂等级的映射在 GeneratedContent.BLOCK_TO_BLUEPRINT。
items:
  mek:pigment_extractor:
    data:
      item_name: '<!i><white><lang:mek.machine.pigment_extractor>'
