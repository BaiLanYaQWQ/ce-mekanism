            south_off:
              auto_state: note_block
              model:
                path: mek:block/pigment_extractor_inactive
                y: 180
            south_on:
              auto_state: note_block
              model:
                path: mek:block/pigment_extractor_active
                y: 180
            west_off:
              auto_state: note_block
              model:
                path: mek:block/pigment_extractor_inactive
                y: 270
            west_on:
              auto_state: note_block
              model:
                path: mek:block/pigment_extractor_active
                y: 270
          variants:
            'facing=north,active=false':
              appearance: north_off
            'facing=east,active=false':
              appearance: east_off
            'facing=south,active=false':
              appearance: south_off
            'facing=west,active=false':
              appearance: west_off
            'facing=north,active=true':
              appearance: north_on
            'facing=east,active=true':
              appearance: east_on
            'facing=south,active=true':
              appearance: south_on
            'facing=west,active=true':
