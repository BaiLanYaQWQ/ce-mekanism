# 私人桶（mekanism:personal_barrel）—— mek.py generate 生成，勿手改。
# 方块 id ↔ 蓝图 id ↔ 工厂等级的映射在 GeneratedContent.BLOCK_TO_BLUEPRINT。
items:
  mek:personal_barrel:
    data:
      item_name: '<!i><white><lang:mek.machine.personal_barrel>'
    model: mek:block/personal_barrel
    behavior:
      type: block_item
      block:
        loot:
          pools:
            - rolls: 1
              entries:
                - type: item
                  item: mek:personal_barrel
        settings:
          hardness: 3.5
          resistance: 6.0
          sounds:
            break: minecraft:block.metal.break
            step: minecraft:block.metal.step
            place: minecraft:block.metal.place
            hit: minecraft:block.metal.hit
            fall: minecraft:block.metal.fall
          tags:
            - minecraft:mineable/pickaxe
            - minecraft:needs_stone_tool
        behavior:
          type: cemekanism:machine
        states:
          properties:
            facing:
              type: 4-direction
              default: north
          appearances:
            north_off:
              auto_state: note_block
              model: mek:block/personal_barrel
            east_off:
              auto_state: note_block
              model:
                path: mek:block/personal_barrel
                y: 90
            south_off:
              auto_state: note_block
              model:
                path: mek:block/personal_barrel
                y: 180
            west_off:
              auto_state: note_block
              model:
                path: mek:block/personal_barrel
                y: 270
          variants:
            'facing=north':
              appearance: north_off
            'facing=east':
              appearance: east_off
            'facing=south':
              appearance: south_off
            'facing=west':
              appearance: west_off
