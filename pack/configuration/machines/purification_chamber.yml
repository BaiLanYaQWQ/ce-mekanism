# 提纯仓（mekanism:purification_chamber）—— mek.py generate 生成，勿手改。
# 方块 id ↔ 蓝图 id ↔ 工厂等级的映射在 GeneratedContent.BLOCK_TO_BLUEPRINT。
items:
  mek:purification_chamber:
    data:
      item_name: '<!i><white><lang:mek.machine.purification_chamber>'
    model: mek:block/purification_chamber
    behavior:
      type: block_item
      block:
        loot:
          pools:
            - rolls: 1
              entries:
                - type: item
                  item: mek:purification_chamber
        settings:
          hardness: 3.5
          resistance: 6.0
          sounds:
            break: minecraft:block.metal.break
            step: minecraft:block.metal.step
            place: minecraft:block.metal.place
            hit: minecraft:block.metal.hit
            fall: minecraft:block.metal.fall
          tags:
            - minecraft:mineable/pickaxe
            - minecraft:needs_stone_tool
        behavior:
          type: cemekanism:machine
        states:
          properties:
            facing:
              type: 4-direction
              default: north
            active:
              type: boolean
              default: false
          appearances:
            north_off:
              auto_state: note_block
              model: mek:block/purification_chamber_inactive
            north_on:
              auto_state: note_block
              model: mek:block/purification_chamber_active
            east_off:
              auto_state: note_block
              model:
                path: mek:block/purification_chamber_inactive
                y: 90
            east_on:
              auto_state: note_block
              model:
                path: mek:block/purification_chamber_active
                y: 90
            south_off:
              auto_state: note_block
              model:
                path: mek:block/purification_chamber_inactive
                y: 180
            south_on:
              auto_state: note_block
              model:
                path: mek:block/purification_chamber_active
                y: 180
            west_off:
              auto_state: note_block
              model:
                path: mek:block/purification_chamber_inactive
                y: 270
            west_on:
              auto_state: note_block
              model:
                path: mek:block/purification_chamber_active
                y: 270
          variants:
            'facing=north,active=false':
              appearance: north_off
            'facing=east,active=false':
              appearance: east_off
            'facing=south,active=false':
              appearance: south_off
            'facing=west,active=false':
              appearance: west_off
            'facing=north,active=true':
              appearance: north_on
            'facing=east,active=true':
              appearance: east_on
            'facing=south,active=true':
              appearance: south_on
            'facing=west,active=true':
              appearance: west_on

