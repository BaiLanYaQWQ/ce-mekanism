# 机械管道（mekanism:mechanical_pipe）—— mek.py generate 生成，勿手改。
# 方块 id ↔ 族 ↔ 级 的映射在 GeneratedContent.TRANSMITTERS；
# 单态方块（06 第九节的形状选型：不做六向连接属性）。
items:
  mek:basic_mechanical_pipe:
    data:
      item_name: '<!i><white><lang:mek.transmitter.basic_mechanical_pipe>'
    model: mek:item/transmitter/mechanical_pipe/basic
    item_model: mek:render/mechanical_pipe_basic_item
    behavior:
      type: block_item
      block:
        loot:
          pools:
            - rolls: 1
              entries:
                - type: item
                  item: mek:basic_mechanical_pipe
        settings:
          hardness: 1.0
          resistance: 6.0
          push_reaction: IMMOVEABLE
          can_occlude: false
          is_suffocating: false
          is_view_blocking: false
          is_redstone_conductor: false
          fluid_state: false
          sounds:
            break: minecraft:block.metal.break
            step: minecraft:block.metal.step
            place: minecraft:block.metal.place
            hit: minecraft:block.metal.hit
            fall: minecraft:block.metal.fall
          tags:
            - minecraft:mineable/pickaxe
        behavior:
          type: cemekanism:transmitter
        state:
          auto_state:
            type: non_tintable_leaves
            id: transparent
          transparent: true

